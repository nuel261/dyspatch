name: Build signed Android APK

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json; fi
          test -f android/app/google-services.json || { echo "::error::android/app/google-services.json is missing (Firebase project dyspatch-bc9cc)"; exit 1; }

      - name: Release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 / ANDROID_KEY_PROPERTIES secrets not set — building a TEST APK signed with the debug key (not for Play Store)"
            echo "SIGNING=debug" >> $GITHUB_ENV
            exit 0
          fi
          echo "SIGNING=release" >> $GITHUB_ENV
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          echo "$KEY_PROPERTIES" > android/key.properties

      - run: flutter pub get
      - run: flutter build apk --release
      - run: flutter build appbundle --release

      - name: Rename outputs
        run: |
          V=$(grep '^version:' pubspec.yaml | awk '{print $2}' | tr '+' '-')
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk ../dist/dyspatch-$V-$SIGNING.apk
          cp build/app/outputs/bundle/release/app-release.aab ../dist/dyspatch-$V-$SIGNING.aab

      - uses: actions/upload-artifact@v4
        with:
          name: dyspatch-android
          path: dist/*
