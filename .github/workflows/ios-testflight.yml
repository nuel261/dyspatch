name: iOS → TestFlight (testing only)

# Builds the customer app and/or the rider app for iOS and uploads them to
# TestFlight. Nothing here submits to the App Store: builds only go to testers.
#
# One repository secret is needed (Settings → Secrets and variables → Actions):
#   ASC_KEY_P8   the full text of AuthKey_45Z85C3C7R.p8 (open it in a text
#                editor and paste everything, BEGIN/END lines included).
#                A base64-encoded copy also works.
# Team, issuer and key IDs below are identifiers, not secrets. The key has the
# Admin role so Xcode can create signing certificates/profiles in the cloud.

on:
  workflow_dispatch:
    inputs:
      app:
        description: Which app to upload
        type: choice
        options: [both, customer, rider]
        default: both

env:
  APPLE_TEAM_ID: 336Z72T6U3
  ASC_ISSUER_ID: 6bfe8df6-d99c-4174-a6d3-86341be7a053
  ASC_KEY_ID: 45Z85C3C7R

jobs:
  testflight:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: customer
            dir: app
            bundle: com.dyspatch.delivery
          - name: rider
            dir: rider
            bundle: com.dyspatch.rider
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - name: Skip if not selected
        id: sel
        working-directory: .
        run: |
          if [ "${{ inputs.app }}" = "both" ] || [ "${{ inputs.app }}" = "${{ matrix.name }}" ]; then echo "go=1" >> "$GITHUB_OUTPUT"; else echo "go=0" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v5
        if: steps.sel.outputs.go == '1'

      - uses: maxim-lobanov/setup-xcode@v1
        if: steps.sel.outputs.go == '1'
        with:
          xcode-version: latest-stable

      - uses: subosito/flutter-action@v2
        if: steps.sel.outputs.go == '1'
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: API key
        if: steps.sel.outputs.go == '1'
        env:
          P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$P8" ]; then echo "::error::Add the ASC_KEY_P8 repository secret (contents of AuthKey_45Z85C3C7R.p8)"; exit 1; fi
          mkdir -p "$RUNNER_TEMP/asc"
          if printf '%s' "$P8" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$P8" > "$RUNNER_TEMP/asc/AuthKey.p8"
          else
            printf '%s' "$P8" | base64 --decode > "$RUNNER_TEMP/asc/AuthKey.p8"
          fi
          grep -q "BEGIN PRIVATE KEY" "$RUNNER_TEMP/asc/AuthKey.p8" || { echo "::error::ASC_KEY_P8 is not a valid .p8 key"; exit 1; }

      - name: Flutter build (no signing yet)
        if: steps.sel.outputs.go == '1'
        run: |
          flutter pub get
          flutter build ios --release --no-codesign --build-number=${{ github.run_number }}

      - name: Archive (automatic cloud signing)
        if: steps.sel.outputs.go == '1'
        run: |
          # Needs at least one iPhone registered under Devices on
          # developer.apple.com, because Apple only issues the development
          # profile used for archiving when the team has a device.
          xcodebuild archive -quiet \
            -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            DEVELOPMENT_TEAM=${{ env.APPLE_TEAM_ID }} CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID ${{ env.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ env.ASC_ISSUER_ID }}

      - name: Export (App Store signing)
        if: steps.sel.outputs.go == '1'
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>${{ env.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID ${{ env.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ env.ASC_ISSUER_ID }}
          ls -la "$RUNNER_TEMP/export"

      - name: Check signature and push entitlement
        if: steps.sel.outputs.go == '1'
        run: |
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)
          rm -rf "$RUNNER_TEMP/chk" && mkdir "$RUNNER_TEMP/chk" && unzip -q "$IPA" -d "$RUNNER_TEMP/chk"
          APP=$(ls -d "$RUNNER_TEMP"/chk/Payload/*.app)
          codesign -dvv "$APP" 2>&1 | grep -E "Authority|TeamIdentifier" | head -3
          codesign -d --entitlements :- "$APP" > "$RUNNER_TEMP/ent.plist" 2>/dev/null
          cat "$RUNNER_TEMP/ent.plist"
          grep -q "aps-environment" "$RUNNER_TEMP/ent.plist" || { echo "::error::Push entitlement missing from signed app"; exit 1; }
          grep -A1 "aps-environment" "$RUNNER_TEMP/ent.plist" | grep -q production || { echo "::error::aps-environment is not production"; exit 1; }

      - name: Upload to TestFlight
        if: steps.sel.outputs.go == '1'
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          cp "$RUNNER_TEMP/asc/AuthKey.p8" ~/.appstoreconnect/private_keys/AuthKey_${{ env.ASC_KEY_ID }}.p8
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey ${{ env.ASC_KEY_ID }} --apiIssuer ${{ env.ASC_ISSUER_ID }}
          echo "### ${{ matrix.name }} (${{ matrix.bundle }}) build ${{ github.run_number }} uploaded to TestFlight" >> "$GITHUB_STEP_SUMMARY"
