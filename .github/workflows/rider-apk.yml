name: Build Rider Android APK

on:
  push:
    branches: [main]
    paths: ['rider/**', '.github/workflows/rider-apk.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rider
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Same pin as the customer app: Flutter 3.50+ requires Gradle 9.3.1 / AGP 9.
          flutter-version: 3.47.7
          cache: true

      - name: Firebase config (push notifications)
        env:
          RIDER_GOOGLE_SERVICES_JSON: ${{ secrets.RIDER_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$RIDER_GOOGLE_SERVICES_JSON" ]; then echo "$RIDER_GOOGLE_SERVICES_JSON" > android/app/google-services.json; fi
          if ! grep -qs '"com.dyspatch.rider"' android/app/google-services.json; then
            echo "::warning::No google-services.json for com.dyspatch.rider — building WITHOUT Firebase push. Offers still arrive by polling while online. Add the app in Firebase (project dyspatch-bc9cc) and save the file as rider/android/app/google-services.json or the RIDER_GOOGLE_SERVICES_JSON secret."
          fi

      - name: Release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 / ANDROID_KEY_PROPERTIES secrets not set — building a TEST APK signed with the debug key (not for Play Store)"
            echo "SIGNING=debug" >> $GITHUB_ENV
            exit 0
          fi
          echo "SIGNING=release" >> $GITHUB_ENV
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          echo "$KEY_PROPERTIES" > android/key.properties

      - run: flutter pub get
      - name: Build APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log
      - name: Report build errors
        if: failure()
        run: |
          grep -E "error|Error:|What went wrong|Exception" build.log | grep -v "^\s*$" | head -120 > errs.txt || true
          split -l 12 errs.txt chunk_ || true
          for f in chunk_*; do msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' "$f"); echo "::error title=build::$msg"; done
      - run: flutter build appbundle --release

      - name: Rename outputs
        run: |
          V=$(grep '^version:' pubspec.yaml | awk '{print $2}' | tr '+' '-')
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk ../dist/dyspatch-rider-$V-$SIGNING.apk
          cp build/app/outputs/bundle/release/app-release.aab ../dist/dyspatch-rider-$V-$SIGNING.aab

      - uses: actions/upload-artifact@v4
        with:
          name: dyspatch-rider-android
          path: dist/*
          retention-days: 7
